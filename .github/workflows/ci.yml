name: Esteira de CI/CD - OS Service

# Mesmo desenho da esteira do MechanicLtda. Este repositório cuida só da APLICAÇÃO; a infra
# (Terraform: ECR, role de OIDC, target group) e os manifestos do Kubernetes ficam em
# OrdemServico-InfraKubernete, e o banco em OrdemServico-InfraSGBD.
#
# - PR e push em desenvolvimento, homologacao e main: build, testes (unidade, API e BDD),
#   cobertura mínima de 80% (falha o build), SonarCloud (quando houver SONAR_TOKEN) e build
#   da imagem.
# - push em main: além disso, publica a imagem no ECR e dispara o deploy no cluster
#   (repository_dispatch no OrdemServico-InfraKubernete).
on:
  push:
    branches: [main, desenvolvimento, homologacao]
  pull_request:
    branches: [main, desenvolvimento, homologacao]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  COBERTURA_MINIMA: 80
  # Precisam bater com os defaults de infra/variables.tf do OrdemServico-InfraKubernete.
  AWS_REGION: us-east-1
  PROJECT_NAME: mechanicltda
  ENVIRONMENT: prod
  ECR_REPOSITORY: mechanicltda-os

permissions:
  contents: read
  pull-requests: read
  # Necessário para o OIDC do GitHub assumir a role da AWS (sem access keys estáticas).
  id-token: write

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    env:
      # Sem o secret (ex.: PR de fork), o Sonar é pulado com aviso; o resto da esteira roda.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'fiap-mecanic-ltda' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Fiap-Mecanic-Ltda_OrdemServico-service' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o Sonar usa o histórico para saber o que é código novo

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (SonarScanner)
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ferramentas
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12
          if [ -n "$SONAR_TOKEN" ]; then
            dotnet tool install --global dotnet-sonarscanner --version 12.1.0
          else
            echo "::warning::SONAR_TOKEN não configurado: análise do SonarCloud pulada."
          fi

      - name: Início da análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/Migrations/**,tests/**"
          /d:sonar.cpd.exclusions="**/Migrations/**"
          /d:sonar.qualitygate.wait=true

      - name: Restore
        run: dotnet restore OsService.sln

      - name: Build
        run: dotnet build OsService.sln --configuration Release --no-restore

      - name: Testes automatizados (unidade, API, Saga e BDD)
        run: >
          dotnet test OsService.sln --configuration Release --no-build --verbosity normal
          --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Relatório de cobertura
        if: always()
        run: |
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/relatorio \
            -reporttypes:"Cobertura;MarkdownSummaryGithub;Html"
          cat coverage/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Cobertura mínima de ${{ env.COBERTURA_MINIMA }}%
        run: python3 scripts/verificar-cobertura.py coverage/relatorio/Cobertura.xml "$COBERTURA_MINIMA"

      # Com sonar.qualitygate.wait, este passo falha se o quality gate reprovar.
      - name: Fim da análise e quality gate do SonarCloud
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publica os resultados de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage/**/coverage.cobertura.xml
            coverage/**/coverage.opencover.xml
            coverage/relatorio/
          if-no-files-found: ignore

  # PR e push fora da main: só confere que a imagem builda.
  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -f src/OsService.API/Dockerfile -t os-service:${{ github.sha }} .

  # Confirma que a role de OIDC (criada pelo Terraform do OrdemServico-InfraKubernete) já
  # existe. Sem isso, um push na main antes do primeiro apply falharia com erro de credencial
  # em vez de pular a publicação com uma mensagem clara.
  check-infra-ready:
    name: Verifica se a role de OIDC já foi provisionada
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checa a role do GitHub Actions do OS Service
        id: check
        run: |
          ROLE_NAME="${PROJECT_NAME}-${ENVIRONMENT}-os-github-actions"
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Role '$ROLE_NAME' ainda não existe. Rode o Terraform (apply) do OrdemServico-InfraKubernete primeiro. Pulando a publicação da imagem."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # Push na main: build e push da imagem no ECR e disparo do deploy.
  docker-build-push:
    name: Build e push da imagem no ECR
    needs: [build-and-test, check-infra-ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-infra-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OsService.API/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O GITHUB_TOKEN deste workflow não dispara workflows em outro repositório, então o
      # disparo usa um token dedicado (fine-grained, só o OrdemServico-InfraKubernete,
      # permissão Contents: read/write). Sem ele, a imagem fica publicada e o aviso diz
      # para rodar o deploy à mão.
      - name: Dispara o deploy no cluster
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.OS_INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$INFRA_DISPATCH_TOKEN" ]; then
            echo "::notice::Imagem publicada com a tag $IMAGE_TAG. Sem OS_INFRA_DISPATCH_TOKEN, rode o workflow de deploy em https://github.com/Fiap-Mecanic-Ltda/OrdemServico-InfraKubernete/actions"
            exit 0
          fi

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $INFRA_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Fiap-Mecanic-Ltda/OrdemServico-InfraKubernete/dispatches" \
            -d "{\"event_type\":\"imagem-publicada\",\"client_payload\":{\"image_tag\":\"$IMAGE_TAG\"}}"

          echo "::notice::Deploy da tag $IMAGE_TAG disparado em Fiap-Mecanic-Ltda/OrdemServico-InfraKubernete."
